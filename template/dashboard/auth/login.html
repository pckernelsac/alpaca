<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FCFBF9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .auth-card {
            border: 1px solid #E5D8C7;
            box-shadow: 0px 4px 12px rgba(74, 67, 62, 0.05);
        }
        .input-field:focus-within {
            border-color: #b8862f;
            box-shadow: 0 0 0 2px rgba(184, 134, 47, 0.1);
        }
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        /* Custom Checkbox */
        input[type="checkbox"] {
            border-color: #E5D8C7;
            color: #b8862f;
        }
        input[type="checkbox"]:focus {
            ring-color: #b8862f;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Main Auth Container -->
<main class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="auth-card bg-white rounded-lg p-10 flex flex-col items-center">
<!-- Header Section -->
<header class="w-full text-center mb-8">
<img alt="Alpacart Logo" class="h-12 w-auto mx-auto mb-6" src="https://lh3.googleusercontent.com/aida/AP1WRLsNqbyk7FFoHRmgGK2Y-lNhawKRCKaf94vyV8U6ZiS5ztYwdlQaj1Q2a9xVlIP2d0XuBS4YsAFSvrz9oeTtmveT9Ebzg3_QlIC_WeVVGnMKLjS_i142MB5RaQXmMA-qao3gTfecCVAPFIpAn6iwWe3x-QsnlptP6xxOnLGybwF8mala4n0kylQbQ0LbuMtiqfFa_0KOoB22AvrsdJDidOskFsjEnjnp2Z6pjZPukg7GLTBCnQyPMDspdqhS">
<div class="space-y-1">
<h1 class="font-headline-sm text-headline-sm text-on-surface">
                        ERP de Gestión Textil
                    </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Bienvenido al Centro de Operaciones
                    </p>
</div>
</header>
<!-- Login Form -->
<form class="w-full space-y-5" id="loginForm">
<!-- Error Message (Hidden by default) -->
<div class="hidden flex items-center gap-2 p-3 bg-error-container text-on-error-container rounded border border-error/20 mb-4 animate-in fade-in duration-300" id="errorMessage">
<span class="material-symbols-outlined text-[18px]">error</span>
<span class="font-body-sm text-body-sm">Credenciales incorrectas. Inténtelo de nuevo.</span>
</div>
<!-- Email Field -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Correo Electrónico</label>
<div class="input-field flex items-center border border-outline-variant rounded bg-white h-[44px] px-3 transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-body-md placeholder:text-outline/60 text-on-surface" id="email" placeholder="nombre@alpacart.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant px-1 text-on-surface" for="password">Contraseña</label>
<div class="input-field flex items-center border border-outline-variant rounded bg-white h-[44px] px-3 transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 text-body-md placeholder:text-outline/60 text-on-surface" id="password" placeholder="••••••••" required="" type="password">
<button class="flex items-center justify-center text-on-surface-variant hover:text-institutional-gold transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded-sm border-outline-variant text-institutional-gold focus:ring-institutional-gold h-4 w-4" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
</label>
<a class="font-body-sm text-body-sm text-institutional-gold hover:underline font-medium" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-institutional-gold hover:bg-[#a07428] active:scale-[0.98] text-white h-[48px] rounded font-title-md text-title-md transition-all duration-200 flex items-center justify-center gap-2 mt-4" id="submitBtn" type="submit">
<span id="btnText">Ingresar</span>
<span class="hidden material-symbols-outlined loading-spinner text-[20px]" data-icon="progress_activity" id="btnSpinner">progress_activity</span>
</button>
</form>
<!-- Additional Help / Info -->
<div class="mt-8 pt-8 border-t border-outline-variant/30 w-full text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    ¿Problemas de acceso? <a class="text-institutional-gold hover:underline" href="#">Contactar soporte IT</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="mt-8 text-center px-gutter">
<p class="font-label-md text-label-md text-on-surface-variant opacity-70 tracking-wide">
            © 2024 Alpacart Textiles. Acceso restringido a personal autorizado.
        </p>
</footer>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const errorMessage = document.getElementById('errorMessage');
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            // Password Toggle logic
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                const icon = togglePassword.querySelector('.material-symbols-outlined');
                icon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });

            // Form Submit Logic (Demo)
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Reset state
                errorMessage.classList.add('hidden');
                btnText.textContent = '';
                btnSpinner.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

                // Simulate API call
                setTimeout(() => {
                    // Logic for "Wrong credentials" simulation
                    btnSpinner.classList.add('hidden');
                    btnText.textContent = 'Ingresar';
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                    
                    // Show error message
                    errorMessage.classList.remove('hidden');
                }, 1500);
            });
        });
    </script>
</body></html>
