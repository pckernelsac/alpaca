name: CI/CD — AlpacaRT

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test
        working-directory: backend
        continue-on-error: true

  frontend-institucional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/pagina-institucional/package-lock.json }
      - run: npm ci
        working-directory: frontend/pagina-institucional
      - run: npm run build
        working-directory: frontend/pagina-institucional

  frontend-tienda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/tienda/package-lock.json }
      - run: npm ci
        working-directory: frontend/tienda
      - run: npm run build
        working-directory: frontend/tienda

  frontend-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/dashboard/package-lock.json }
      - run: npm ci
        working-directory: frontend/dashboard
      - run: npm run build
        working-directory: frontend/dashboard
