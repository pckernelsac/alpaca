# Un host, tres aplicaciones y la API.
#
#   /          institucional
#   /tienda/   tienda
#   /panel/    back office
#   /api/      backend FastAPI
#
# Los prefijos coinciden con la `base` de Vite y con el `basename` del router de
# cada app: cambiar uno obliga a cambiar los tres.

# El cacheo se decide por URI y no dentro de cada location a proposito: un
# `add_header` en un location descarta TODOS los heredados del server, y ahi se
# perderian en silencio las cabeceras de seguridad. Con un map queda una sola
# tanda de add_header, a nivel server, y nada se pisa.
#
#   assets/  llevan hash en el nombre: si cambia el contenido cambia la URL.
#   el resto es index.html, lo unico que sabe cual es el bundle vigente;
#   guardado deja al navegador pidiendo assets que ya no existen.
map $uri $alpacart_cache {
    default                       "no-store";
    ~^/(tienda/|panel/)?assets/   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker, fijo en esta direccion en toda red definida por el
    # usuario. valid=10s para que un reinicio del backend se note enseguida.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Traefik ya termina TLS; aca solo hace falta no mentir sobre el tamanio.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Sin CSP a proposito: las tres apps cargan Google Fonts y fotos de
    # Unsplash, y una politica mal puesta rompe la pagina en silencio. Si se
    # agrega, probarla en las tres.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $alpacart_cache always;

    # --- API ----------------------------------------------------------------
    # El nombre del servicio lleva el prefijo del proyecto a proposito: en
    # Dokploy todos los stacks comparten dokploy-network y un `backend` pelado
    # puede resolver al backend de otra aplicacion.
    #
    # El destino va en una variable y no literal, con el DNS interno de Docker
    # declarado arriba. Con el nombre literal nginx resuelve al cargar la
    # configuracion: si el backend todavia no existe se niega a arrancar, y si
    # se reinicia con otra IP se queda pegado a la vieja hasta que alguien
    # recargue nginx. Con variable resuelve por pedido. El contra es que
    # entonces no reenvia el URI solo: hay que pasarle $request_uri.
    location /api/ {
        set $alpacart_backend http://alpacart-backend:8000;
        proxy_pass $alpacart_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Que mande el backend: sus respuestas ya dicen que se puede cachear.
        proxy_hide_header Cache-Control;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- salud del propio nginx ---------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- assets con hash ----------------------------------------------------
    # Location regex: gana sobre los de prefijo, asi que atrapa /assets/,
    # /tienda/assets/ y /panel/assets/ antes que las tres SPA. El =404 es
    # deliberado: un asset que falta tiene que fallar, no devolver el index.
    location ~ ^/(tienda/|panel/)?assets/ {
        try_files $uri =404;
    }

    # --- tienda -------------------------------------------------------------
    location = /tienda { return 301 /tienda/; }

    location /tienda/ {
        try_files $uri $uri/ /tienda/index.html;
    }

    # --- panel --------------------------------------------------------------
    location = /panel { return 301 /panel/; }

    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }

    # --- institucional ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
