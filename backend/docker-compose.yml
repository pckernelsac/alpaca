services:
  postgres:
    image: postgres:16-alpine
    container_name: alpacart-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: alpacart
      POSTGRES_USER: alpacart
      POSTGRES_PASSWORD: alpacart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpacart -d alpacart"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: alpacart-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  redis:
    image: redis:7-alpine
    container_name: alpacart-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:
