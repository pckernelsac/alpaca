services:
  postgres:
    image: postgres:16-alpine
    container_name: alpacart-r7v-pg
    ports:
      - "5446:5432"
    environment:
      POSTGRES_DB: alpacart_r7v
      POSTGRES_USER: alpacart
      POSTGRES_PASSWORD: alpacart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpacart -d alpacart_r7v"]
      interval: 3s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    container_name: alpacart-r7v-redis
    ports:
      - "6387:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
